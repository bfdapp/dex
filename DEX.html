<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>BF 双向链上兑换</title>
<link rel="icon" href="favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#0b1224;
    padding:25px 16px;
    font-family:Microsoft Yahei,sans-serif;
}
.trade-container{
    max-width:480px;
    margin:0 auto;
}
.trade-tit{
    text-align:center;
    font-size:18px;
    color:#ffd250;
    font-weight:600;
    margin-bottom:20px;
}
.tab-box{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}
.tab-item{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:10px;
    background:#161e33;
    color:#999;
    font-size:15px;
    cursor:pointer;
}
.tab-item.active{
    background:linear-gradient(90deg,#27c707,#1a9c5c);
    color:#fff;
}
.swap-box{
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    padding:20px;
    border:1px solid rgba(255,210,80,0.2);
}
.input-item{
    margin-bottom:15px;
}
.input-item label{
    display:block;
    color:#ccc;
    font-size:14px;
    margin-bottom:6px;
}
.input-item input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    background:#161e33;
    color:#fff;
    font-size:15px;
    outline:none;
}
.swap-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#27c707,#1a9c5c);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}
.wallet-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#407bff,#2554d1);
    color:#fff;
    font-size:15px;
    cursor:pointer;
    margin-bottom:10px;
}
.home-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#6c757d;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    margin-bottom:15px;
}
.status{
    text-align:center;
    font-size:13px;
    color:#94a3b8;
    margin:12px 0;
}
.balance-box{
    background:rgba(255,210,80,0.1);
    border-radius:10px;
    padding:10px;
    text-align:center;
    font-size:14px;
    color:#eee;
    margin-bottom:15px;
}
.price-box{
    text-align:center;
    color:#ffd250;
    margin-bottom:10px;
    font-size:14px;
}
.hide{display:none;}
.pct-btn {
    padding:6px 12px;
    border-radius:6px;
    border:none;
    background:#161e33;
    color:#999;
    font-size:14px;
    cursor:pointer;
}
.pct-btn.active {
    background:#27c707;
    color:#fff;
}
.token-search-box{
    background:#161e33;
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:12px;
    color:#fff;
    border:1px solid #27c707;
    display:flex;
    gap:10px;
    align-items:center;
}
.token-search-input{
    flex:1;
    background:transparent;
    border:none;
    color:#fff;
    outline:none;
    font-size:14px;
}
.token-confirm-btn{
    padding:8px 12px;
    border-radius:8px;
    border:none;
    background:#27c707;
    color:#fff;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
}
.current-token{
    color:#27c707;
    font-size:13px;
    margin-top:6px;
}
</style>
</head>
<body>
<div class="trade-container">
    <h3 class="trade-tit">BNB ↔ 代币 双向链上兑换</h3>

    <button class="home-btn" id="homeBtn">返回主页</button>
    <button class="wallet-btn" id="connectBtn">连接BSC钱包</button>
    <div class="status" id="walletStatus">未连接钱包</div>

    <div class="token-search-box">
        <input class="token-search-input" id="tokenSearch" placeholder="粘贴代币合约地址">
        <button class="token-confirm-btn" id="confirmTokenBtn">确认</button>
    </div>
    <div class="current-token" id="currentToken">当前交易：BF</div>

    <div class="balance-box" id="balanceBox" style="display:none;">
        BNB余额：<span id="bnbBalance">0.0000</span> &nbsp;&nbsp;
        代币余额：<span id="tokenBalance">0.00</span>
    </div>

    <div class="price-box" id="realPrice">实时价格：加载中...</div>

    <div class="tab-box">
        <div class="tab-item active" id="buyTab">BNB买代币</div>
        <div class="tab-item" id="sellTab">代币卖BNB</div>
    </div>

    <div class="swap-box" id="buyBox">
        <div class="input-item">
            <label>支付 BNB 数量</label>
            <input type="number" id="payBnb" placeholder="输入BNB数量" min="0" step="0.0001">
        </div>
        <div class="input-item">
            <label>预估获得 代币</label>
            <input type="text" id="getToken" placeholder="自动计算" readonly>
        </div>
        <button class="swap-btn" id="buyBtn">确认买入代币</button>
    </div>

    <div class="swap-box hide" id="sellBox">
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:15px;">
            <button class="pct-btn" data-pct="25">25%</button>
            <button class="pct-btn" data-pct="50">50%</button>
            <button class="pct-btn active" data-pct="100">MAX</button>
        </div>

        <div class="input-item">
            <label>卖出 代币 数量</label>
            <input type="number" id="payToken" placeholder="输入代币数量" min="0" step="0.0001">
        </div>

        <div class="input-item">
            <label>滑点设置（建议 25%）</label>
            <input type="number" id="slippage" value="25" placeholder="滑点%" min="1" max="99">
        </div>

        <div class="input-item">
            <label>预估获得 BNB</label>
            <input type="text" id="getBnb" placeholder="自动计算" readonly>
        </div>
        <button class="swap-btn" id="sellBtn">确认卖出代币</button>
    </div>
</div>

<script>
const BSC_CHAIN_ID = 56;
const BSC_HEX = "0x38";
let CURRENT_TOKEN = "0x3A79A34f29347b3A9c3fB75f07281521e7a8aa3C";
const ROUTER_ADDR = "0x10ED43C718714eb63d5aA57B78B54704E256024E";
const WBNB = "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c";
const RPC_LIST = [
    "https://bsc.publicnode.com",
    "https://rpc.ankr.com/bsc",
    "https://bsc-dataseed.binance.org/"
];

let provider, signer, router, tokenContract;

const homeBtn = document.getElementById("homeBtn");
const connectBtn = document.getElementById("connectBtn");
const walletStatus = document.getElementById("walletStatus");
const balanceBox = document.getElementById("balanceBox");
const bnbBalance = document.getElementById("bnbBalance");
const tokenBalance = document.getElementById("tokenBalance");
const realPrice = document.getElementById("realPrice");
const payBnb = document.getElementById("payBnb");
const getToken = document.getElementById("getToken");
const payToken = document.getElementById("payToken");
const getBnb = document.getElementById("getBnb");
const buyBtn = document.getElementById("buyBtn");
const sellBtn = document.getElementById("sellBtn");
const buyTab = document.getElementById("buyTab");
const sellTab = document.getElementById("sellTab");
const buyBox = document.getElementById("buyBox");
const sellBox = document.getElementById("sellBox");
const slippageInput = document.getElementById("slippage");
const tokenSearch = document.getElementById("tokenSearch");
const confirmTokenBtn = document.getElementById("confirmTokenBtn");
const currentToken = document.getElementById("currentToken");

const ROUTER_ABI = [
    "function getAmountsOut(uint amountIn, address[] calldata path) external view returns (uint[] memory amounts)",
    "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)",
    "function swapExactTokensForETH(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)",
    "function swapExactTokensForETHSupportingFeeOnTransferTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external"
];

const BEP20_ABI = [
    "function balanceOf(address) external view returns (uint)",
    "function approve(address spender, uint value) external returns (bool)",
    "function symbol() external view returns (string)",
    "function decimals() external view returns (uint8)"
];

homeBtn.onclick = function(){
    window.location.href = "index.html";
};

buyTab.onclick = () => {
    buyTab.classList.add("active");
    sellTab.classList.remove("active");
    buyBox.classList.remove("hide");
    sellBox.classList.add("hide");
};
sellTab.onclick = () => {
    sellTab.classList.add("active");
    buyTab.classList.remove("active");
    sellBox.classList.remove("hide");
    buyBox.classList.add("hide");
};

async function switchBSC() {
    try {
        await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [{
                chainId: BSC_HEX,
                chainName: "BSC",
                nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
                rpcUrls: RPC_LIST,
                blockExplorerUrls: ["https://bscscan.com"]
            }]
        });
    } catch (e) {}
}

async function getQuote(amountIn, path) {
    for (const rpc of RPC_LIST) {
        try {
            const tempProvider = new ethers.providers.JsonRpcProvider(rpc, BSC_CHAIN_ID);
            const r = new ethers.Contract(ROUTER_ADDR, ROUTER_ABI, tempProvider);
            const amt = ethers.utils.parseEther(amountIn.toString());
            const out = await r.getAmountsOut(amt, path);
            return { ok: true, value: ethers.utils.formatUnits(out[1], 18) };
        } catch (e) {
            continue;
        }
    }
    return { ok: false, value: "0" };
}

async function refreshPrice() {
    try {
        const res = await getQuote(1, [WBNB, CURRENT_TOKEN]);
        if (!res.ok || parseFloat(res.value) <= 0) {
            realPrice.innerText = "实时价格：无流动性或无效代币";
        } else {
            realPrice.innerText = `实时价格：1 BNB = ${parseFloat(res.value).toFixed(4)} 代币`;
        }
    } catch(e) {
        realPrice.innerText = "实时价格：获取失败";
    }
}

payBnb.oninput = async () => {
    const v = payBnb.value;
    if (!v || v <= 0) { getToken.value = ""; return; }
    const res = await getQuote(v, [WBNB, CURRENT_TOKEN]);
    if (!res.ok || parseFloat(res.value) <= 0) {
        getToken.value = "无价格";
    } else {
        getToken.value = parseFloat(res.value).toFixed(4);
    }
};

payToken.oninput = async () => {
    const v = payToken.value;
    if (!v || v <= 0) { getBnb.value = ""; return; }
    const res = await getQuote(v, [CURRENT_TOKEN, WBNB]);
    if (!res.ok || parseFloat(res.value) <= 0) {
        getBnb.value = "无价格";
    } else {
        getBnb.value = parseFloat(res.value).toFixed(6);
    }
};

async function loadBalances(addr) {
    try {
        const p = new ethers.providers.JsonRpcProvider(RPC_LIST[0]);
        const bnb = await p.getBalance(addr);

        const tokCon = new ethers.Contract(CURRENT_TOKEN, BEP20_ABI, p);
        const decimals = await tokCon.decimals();
        const bal = await tokCon.balanceOf(addr);

        bnbBalance.innerText = ethers.utils.formatEther(bnb).slice(0, 6);
        tokenBalance.innerText = ethers.utils.formatUnits(bal, decimals).slice(0, 6);
        balanceBox.style.display = "block";
    } catch (e) {
        tokenBalance.innerText = "0.00";
    }
}

connectBtn.onclick = async () => {
    if (!window.ethereum) { alert("请安装钱包"); return; }
    try {
        await window.ethereum.request({ method: "eth_requestAccounts" });
        await switchBSC();
        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();
        const addr = await signer.getAddress();
        walletStatus.innerText = `已连接：${addr.slice(0, 6)}...`;
        router = new ethers.Contract(ROUTER_ADDR, ROUTER_ABI, signer);
        tokenContract = new ethers.Contract(CURRENT_TOKEN, BEP20_ABI, signer);
        loadBalances(addr);
        refreshPrice();
    } catch (e) {
        alert("连接失败：" + e.message);
    }
};

buyBtn.onclick = async () => {
    try {
        if (!signer) { alert("请连接钱包"); return; }
        const val = payBnb.value;
        if (!val || val <= 0) { alert("输入数量"); return; }
        buyBtn.innerText = "交易中...";
        const res = await getQuote(val, [WBNB, CURRENT_TOKEN]);
        if (!res.ok || parseFloat(res.value) <= 0) throw new Error("该代币无流动性，无法买入");

        const slippage = Number(slippageInput.value) || 25;
        const factor = (100 - slippage) / 100;
        const minOut = ethers.utils.parseEther((parseFloat(res.value) * factor).toFixed(6));

        const tx = await router.swapExactETHForTokens(
            minOut,
            [WBNB, CURRENT_TOKEN],
            await signer.getAddress(),
            Math.floor(Date.now() / 1000) + 600,
            { value: ethers.utils.parseEther(val) }
        );
        alert("已提交：" + tx.hash);
        await tx.wait();
        alert("买入成功！");
        loadBalances(await signer.getAddress());
    } catch (e) {
        alert("买入失败：" + e.message);
    } finally {
        buyBtn.innerText = "确认买入代币";
    }
};

sellBtn.onclick = async () => {
    if (!signer) return alert("请先连接钱包");
    const val = Number(payToken.value);
    if (!val || val <= 0) return alert("请输入正确的代币数量");

    const slippage = Number(slippageInput.value) || 25;
    const factor = (100 - slippage) / 100;

    sellBtn.innerText = "准备交易...";
    try {
        const userAddr = await signer.getAddress();
        const tokenAmount = ethers.utils.parseUnits(val.toString(), 18);

        sellBtn.innerText = "授权中...";
        const approveTx = await tokenContract.approve(ROUTER_ADDR, ethers.constants.MaxUint256);
        await approveTx.wait();

        sellBtn.innerText = "获取报价...";
        const res = await getQuote(val, [CURRENT_TOKEN, WBNB]);
        if (!res.ok || Number(res.value) <= 0) throw new Error("该代币无流动性，无法卖出");
        
        const minBNBOut = ethers.utils.parseEther((Number(res.value) * factor).toFixed(8));
        sellBtn.innerText = "交易中...";
        const deadline = Math.floor(Date.now() / 1000) + 600;
        
        const swapTx = await router.swapExactTokensForETHSupportingFeeOnTransferTokens(
            tokenAmount,
            minBNBOut,
            [CURRENT_TOKEN, WBNB],
            userAddr,
            deadline,
            { gasLimit: 500000 }
        );

        alert(`交易已提交！\n哈希：${swapTx.hash}`);
        await swapTx.wait();
        alert("卖出成功！");
        await loadBalances(userAddr);

    } catch (err) {
        console.error(err);
        let msg = "卖出失败";
        if (err.message.includes("user rejected")) msg = "已取消交易";
        if (err.message.includes("INSUFFICIENT_OUTPUT_AMOUNT")) msg = "滑点不足，请调高滑点（建议25%~30%）";
        alert(msg);
    } finally {
        sellBtn.innerText = "确认卖出代币";
    }
};

document.querySelectorAll(".pct-btn").forEach(btn => {
    btn.onclick = async () => {
        if(!signer) return alert("请先连接钱包");
        document.querySelectorAll(".pct-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        let pct = parseInt(btn.dataset.pct);
        let addr = await signer.getAddress();
        let p = new ethers.providers.JsonRpcProvider(RPC_LIST[0]);
        let con = new ethers.Contract(CURRENT_TOKEN, BEP20_ABI, p);
        let decimals = await con.decimals();
        let bal = await con.balanceOf(addr);
        let val = parseFloat(ethers.utils.formatUnits(bal, decimals)) * pct / 100;
        payToken.value = val.toFixed(4);
        let qres = await getQuote(val, [CURRENT_TOKEN, WBNB]);
        getBnb.value = (qres.ok && parseFloat(qres.value) > 0) ? parseFloat(qres.value).toFixed(6) : "无价格";
    }
});

// 改为点击确认按钮才切换代币
confirmTokenBtn.onclick = async () => {
    let addr = tokenSearch.value.trim();
    if(!addr.startsWith("0x") || addr.length !== 42) return alert("合约地址格式错误");
    try{
        let p = new ethers.providers.JsonRpcProvider(RPC_LIST[0]);
        let c = new ethers.Contract(addr, BEP20_ABI, p);
        let sym = await c.symbol();
        CURRENT_TOKEN = addr;
        currentToken.innerText = `当前交易：${sym} (${addr.slice(0,6)}...)`;
        tokenSearch.value = "";

        payBnb.value = "";
        getToken.value = "";
        payToken.value = "";
        getBnb.value = "";

        refreshPrice();
        if(signer){
            tokenContract = new ethers.Contract(CURRENT_TOKEN, BEP20_ABI, signer);
            loadBalances(await signer.getAddress());
        }
        alert(`切换成功：${sym}`);
    }catch(e){
        alert("无法识别此代币，请检查合约或链上无该代币");
    }
};

// 页面加载自动刷一次
refreshPrice();
</script>
</body>
</html>
