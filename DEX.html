<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>BF SWAP 兑换中心</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#0b0f1a;padding:30px 15px;color:#fff;}
.swap-container{max-width:440px;margin:0 auto;}
.swap-box{background:#161c2a;border-radius:20px;padding:24px;border:1px solid #262c3a;}
.head-title{font-size:20px;font-weight:600;margin-bottom:20px;color:#ffd250;text-align:center;}

.wallet-line{display:flex;justify-content:space-between;margin-bottom:16px;}
.connect-btn{background:#26ac75;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;}
.home-btn{background:#252b3a;color:#ccc;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;}

/* 搜索代币 */
.search-token{display:flex;gap:8px;margin-bottom:16px;}
#tokenSearchInput{flex:1;background:#202735;border:none;outline:none;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;}
#searchTokenBtn{background:#26ac75;color:#fff;border:none;padding:12px 16px;border-radius:12px;cursor:pointer;}

.token-list{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;max-height:110px;overflow-y:auto;padding-right:5px;}
.token-item{display:flex;align-items:center;gap:8px;background:#252b3a;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;}
.token-item:hover{background:#26ac75;}
.token-icon{width:24px;height:24px;border-radius:50%;object-fit:cover;}
.token-name{font-size:14px;color:#fff;font-weight:500;}

.token-card{background:#202735;border-radius:16px;padding:18px;margin-bottom:12px;}
.token-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.token-left{display:flex;align-items:center;gap:10px;}
.token-balance{font-size:12px;color:#999;}
.num-input{width:100%;background:transparent;border:none;outline:none;color:#fff;font-size:24px;text-align:right;font-weight:600;}

.switch-btn{text-align:center;font-size:22px;color:#26ac75;margin:8px 0;cursor:pointer;}
.slippage-box{display:flex;align-items:center;gap:10px;margin:16px 0;}
.slippage-input{width:60px;background:#202735;border:none;color:#fff;padding:8px;border-radius:8px;text-align:center;}
.swap-btn{width:100%;background:#26ac75;color:#fff;border:none;padding:16px;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;}

/* 钱包弹窗 */
.wallet-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:999;}
.wallet-modal-content{background:#161c2a;border-radius:20px;padding:24px;width:90%;max-width:400px;border:1px solid #262c3a;}
.wallet-modal-title{font-size:18px;font-weight:600;margin-bottom:20px;text-align:center;}
.wallet-item{display:flex;align-items:center;gap:12px;background:#252b3a;padding:12px 16px;border-radius:12px;cursor:pointer;margin-bottom:10px;}
.wallet-item:hover{background:#26ac75;}
.wallet-icon{width:32px;height:32px;border-radius:8px;object-fit:cover;}
.wallet-name{font-size:16px;font-weight:500;}
.close-modal{text-align:right;margin-bottom:10px;}
.close-modal button{background:transparent;border:none;color:#999;font-size:20px;cursor:pointer;}
</style>
</head>

<body>
<div class="swap-container">
  <div class="swap-box">
    <div class="head-title">BF 去中心化兑换</div>
    <div class="wallet-line">
      <button class="home-btn" onclick="location.href='index.html'">🏠 首页</button>
      <button class="connect-btn" id="connectBtn">连接钱包</button>
    </div>

    <!-- 搜索任意代币 -->
    <div class="search-token">
      <input id="tokenSearchInput" placeholder="输入代币合约地址搜索...">
      <button id="searchTokenBtn">搜索</button>
    </div>

    <div class="token-list" id="tokenList"></div>

    <div class="token-card">
      <div class="token-top">
        <div class="token-left">
          <img id="sellIcon" class="token-icon">
          <span id="sellSymbol">BNB</span>
        </div>
        <div class="token-balance">余额: <span id="sellBal">0.00</span></div>
      </div>
      <input type="number" class="num-input" id="sellAmount" placeholder="0.0">
    </div>

    <div class="switch-btn" onclick="reverseTokens()">⇅</div>

    <div class="token-card">
      <div class="token-top">
        <div class="token-left">
          <img id="buyIcon" class="token-icon">
          <span id="buySymbol">BF</span>
        </div>
        <div class="token-balance">余额: <span id="buyBal">0.00</span></div>
      </div>
      <input type="text" class="num-input" id="buyAmount" placeholder="0.0" readonly>
    </div>

    <div class="slippage-box">
      <span>滑点</span>
      <input class="slippage-input" id="slippage" value="25" type="number">
      <span>%</span>
    </div>

    <button class="swap-btn" id="swapBtn">确认兑换</button>
  </div>
</div>

<!-- 钱包选择弹窗 -->
<div class="wallet-modal" id="walletModal" style="display:none;">
  <div class="wallet-modal-content">
    <div class="close-modal"><button onclick="closeWalletModal()">×</button></div>
    <div class="wallet-modal-title">选择钱包</div>
    <div class="wallet-item" onclick="connectWallet('metamask')">
      <img class="wallet-icon" src="https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/meta.png">
      <span class="wallet-name">MetaMask</span>
    </div>
    <div class="wallet-item" onclick="connectWallet('tp')">
      <img class="wallet-icon" src="https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/tp.png">
      <span class="wallet-name">TP钱包</span>
    </div>
    <div class="wallet-item" onclick="connectWallet('okx')">
      <img class="wallet-icon" src="https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/okx.png">
      <span class="wallet-name">OKX钱包</span>
    </div>
    <div class="wallet-item" onclick="connectWallet('bitget')">
      <img class="wallet-icon" src="https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/bitget.png">
      <span class="wallet-name">Bitget钱包</span>
    </div>
    <div class="wallet-item" onclick="connectWallet('trust')">
      <img class="wallet-icon" src="https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/trust.png">
      <span class="wallet-name">TrustWallet</span>
    </div>
  </div>
</div>

<script>
// 核心配置
const ROUTER = "0x10ED43C718714eb63d5aA57B78B54704E256024E";
const WBNB = "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c";
const BF = "0x3A79A34f29347b3A9c3fB75f07281521e7a8aa3C";
const BSC_CHAIN_ID = 56;
const BSC_HEX = "0x38";

// 固定代币
let tokenList = [
  {name: "BNB", symbol: "BNB", addr: WBNB, icon: "https://assets.pancakeswap.finance/web/images/tokens/BNB.png", decimals:18},
  {name: "USDT", symbol: "USDT", addr: "0x55d398326f99059fF775485246999027B3197955", icon: "https://assets.pancakeswap.finance/web/images/tokens/USDT.png", decimals:18},
  {name: "CAKE", symbol: "CAKE", addr: "0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cA83", icon: "https://assets.pancakeswap.finance/web/images/tokens/CAKE.png", decimals:18},
  {name: "BF", symbol: "BF", addr: BF, icon: "https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/473ca914615742a588b70e35e14f90cc.png", decimals:18}
];

let sellToken = {...tokenList[0]};
let buyToken = {...tokenList[3]};
let signer, userAddr, provider;

// 渲染代币列表
function renderTokens(){
  const list = document.getElementById("tokenList");
  list.innerHTML = "";
  tokenList.forEach(t=>{
    const item = document.createElement("div");
    item.className = "token-item";
    item.innerHTML = `<img class="token-icon" src="${t.icon}"><span>${t.symbol}</span>`;
    item.onclick = ()=>{
      buyToken = {...t};
      document.getElementById("buySymbol").innerText = buyToken.symbol;
      document.getElementById("buyIcon").src = buyToken.icon;
      calOut();
    };
    list.appendChild(item);
  });
}

// 搜索任意代币
document.getElementById("searchTokenBtn").onclick = async ()=>{
  const addr = document.getElementById("tokenSearchInput").value.trim();
  if(!addr || !addr.startsWith("0x") || addr.length!==42) return alert("请输入有效的合约地址");
  if(tokenList.find(t=>t.addr.toLowerCase()===addr.toLowerCase())) return alert("代币已存在");

  try {
    const p = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org");
    const contract = new ethers.Contract(addr, [
      "function name() view returns(string)",
      "function symbol() view returns(string)",
      "function decimals() view returns(uint8)"
    ], p);
    const name = await contract.name();
    const symbol = await contract.symbol();
    const decimals = await contract.decimals();
    tokenList.push({name, symbol, addr, icon:"https://p6-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/default.png", decimals});
    renderTokens();
    document.getElementById("tokenSearchInput").value = "";
  } catch (e) {
    alert("获取代币信息失败，可能不是有效BEP20合约");
    console.error(e);
  }
};

// 初始化
renderTokens();
document.getElementById("sellIcon").src = sellToken.icon;
document.getElementById("buyIcon").src = buyToken.icon;

// 互换
function reverseTokens(){
  [sellToken, buyToken] = [buyToken, sellToken];
  document.getElementById("sellSymbol").innerText = sellToken.symbol;
  document.getElementById("buySymbol").innerText = buyToken.symbol;
  document.getElementById("sellIcon").src = sellToken.icon;
  document.getElementById("buyIcon").src = buyToken.icon;
  document.getElementById("sellAmount").value = "";
  document.getElementById("buyAmount").value = "";
}

// 计算数量
async function calOut(){
  const val = document.getElementById("sellAmount").value;
  if(!val || val <= 0) return;
  try {
    const p = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org");
    const router = new ethers.Contract(ROUTER, ["function getAmountsOut(uint,address[]) view returns(uint[])"], p);
    const out = await router.getAmountsOut(ethers.utils.parseEther(val), [sellToken.addr, buyToken.addr]);
    document.getElementById("buyAmount").value = ethers.utils.formatEther(out[1]).slice(0,8);
  } catch (e) {
    document.getElementById("buyAmount").value = "获取失败";
    console.error("calOut error:", e);
  }
}
document.getElementById("sellAmount").oninput = calOut;

// 钱包弹窗
document.getElementById("connectBtn").onclick = ()=>{
  document.getElementById("walletModal").style.display = "flex";
};
function closeWalletModal(){
  document.getElementById("walletModal").style.display = "none";
}

// 连接钱包（兼容多钱包）
async function connectWallet(type){
  closeWalletModal();
  if(!window.ethereum) return alert("请安装对应钱包插件/APP");
  try {
    await ethereum.request({method:"eth_requestAccounts"});
    await switchBSC();
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    userAddr = await signer.getAddress();
    document.getElementById("connectBtn").innerText = `已连接: ${userAddr.slice(0,6)}...`;
    await loadBalances();
  } catch (e) {
    alert("连接失败: " + e.message);
    console.error("connect error:", e);
  }
}

// 切换BSC
async function switchBSC(){
  try {
    await ethereum.request({
      method: "wallet_addEthereumChain",
      params: [{
        chainId: BSC_HEX,
        chainName: "Binance Smart Chain",
        nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
        rpcUrls: ["https://bsc-dataseed.binance.org"],
        blockExplorerUrls: ["https://bscscan.com"]
      }]
    });
  } catch (e) {
    throw new Error("无法切换到BSC，请手动切换");
  }
}

// 加载余额
async function loadBalances(){
  if(!userAddr) return;
  try {
    const p = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org");
    // 卖
    if(sellToken.addr.toLowerCase() === WBNB.toLowerCase()){
      const bal = await p.getBalance(userAddr);
      document.getElementById("sellBal").innerText = parseFloat(ethers.utils.formatEther(bal)).toFixed(4);
    } else {
      const sellContract = new ethers.Contract(sellToken.addr, ["function balanceOf(address) view returns(uint)"], p);
      const bal = await sellContract.balanceOf(userAddr);
      document.getElementById("sellBal").innerText = parseFloat(ethers.utils.formatEther(bal)).toFixed(4);
    }
    // 买
    const buyContract = new ethers.Contract(buyToken.addr, ["function balanceOf(address) view returns(uint)"], p);
    const buyBal = await buyContract.balanceOf(userAddr);
    document.getElementById("buyBal").innerText = parseFloat(ethers.utils.formatEther(buyBal)).toFixed(4);
  } catch (e) {
    document.getElementById("sellBal").innerText = "0.00";
    document.getElementById("buyBal").innerText = "0.00";
    console.error("loadBalances error:", e);
  }
}

// 兑换
document.getElementById("swapBtn").onclick = async ()=>{
  console.log("swapBtn clicked");
  if(!signer) return alert("请先连接钱包");
  const val = document.getElementById("sellAmount").value;
  if(!val || val <= 0) return alert("请输入兑换数量");
  const slip = parseInt(document.getElementById("slippage").value) || 25;

  try {
    const router = new ethers.Contract(ROUTER, [
      "function swapExactETHForTokensSupportingFeeOnTransferTokens(uint,address[],address,uint) payable",
      "function swapExactTokensForETHSupportingFeeOnTransferTokens(uint,uint,address[],address,uint)",
      "function swapExactTokensForTokensSupportingFeeOnTransferTokens(uint,uint,address[],address,uint)",
      "function getAmountsOut(uint,address[]) view returns(uint[])"
    ], signer);

    const path = [sellToken.addr, buyToken.addr];
    const amounts = await router.getAmountsOut(ethers.utils.parseEther(val), path);
    const minOut = amounts[1].mul(100 - slip).div(100);
    const deadline = Math.floor(Date.now()/1000) + 600;
    const gasLimit = 700000;

    console.log("swap params:", {val, slip, path, minOut, deadline});

    if(sellToken.addr.toLowerCase() === WBNB.toLowerCase()){
      // BNB → 代币
      const tx = await router.swapExactETHForTokensSupportingFeeOnTransferTokens(
        minOut, path, userAddr, deadline,
        {value: ethers.utils.parseEther(val), gasLimit}
      );
      console.log("tx sent:", tx.hash);
      await tx.wait();
      alert("兑换成功！");
    } else if(buyToken.addr.toLowerCase() === WBNB.toLowerCase()){
      // 代币 → BNB
      const sellContract = new ethers.Contract(sellToken.addr, ["function approve(address,uint) returns(bool)"], signer);
      console.log("approve...");
      await sellContract.approve(ROUTER, ethers.constants.MaxUint256);
      const tx = await router.swapExactTokensForETHSupportingFeeOnTransferTokens(
        ethers.utils.parseEther(val), minOut, path, userAddr, deadline, {gasLimit}
      );
      await tx.wait();
      alert("兑换成功！");
    } else {
      // 代币 → 代币
      const sellContract = new ethers.Contract(sellToken.addr, ["function approve(address,uint) returns(bool)"], signer);
      await sellContract.approve(ROUTER, ethers.constants.MaxUint256);
      const tx = await router.swapExactTokensForTokensSupportingFeeOnTransferTokens(
        ethers.utils.parseEther(val), minOut, path, userAddr, deadline, {gasLimit}
      );
      await tx.wait();
      alert("兑换成功！");
    }

    await loadBalances();
    document.getElementById("sellAmount").value = "";
    document.getElementById("buyAmount").value = "";
  } catch (e) {
    console.error("swap error:", e);
    alert("兑换失败: " + (e.message || "未知错误"));
  }
};

// 监听钱包切换
if(window.ethereum){
  ethereum.on("accountsChanged", () => location.reload());
  ethereum.on("chainChanged", () => location.reload());
}
</script>
</body>
</html>
